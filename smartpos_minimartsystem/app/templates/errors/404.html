{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}
{% block page_title %}Resource Not Found (404){% endblock %}

{% block content %}
<div style="text-align:center; padding:4rem 1rem; max-width:500px; margin:0 auto;">
  <div style="width:80px; height:80px; border-radius:50%; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:2.2rem; margin:0 auto 1.5rem;">
    <i class="fa-solid fa-compass"></i>
  </div>
  <h2 style="font-size:1.75rem; font-weight:800; color:var(--text-main); margin-bottom:0.5rem;">Page Not Found</h2>
  <p style="color:var(--text-muted); margin-bottom:1.5rem;">
    The requested system route or data item does not exist or has been relocated.
  </p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
    <i class="fa-solid fa-house"></i> Return to Dashboard
  </a>
</div>
{% endblock %}
